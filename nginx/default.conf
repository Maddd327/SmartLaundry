# Failover pasif: A utama, B cadangan. Open-source Nginx menandai A gagal
# setelah kegagalan koneksi, lalu mencoba B untuk permintaan yang aman diulang.
upstream order_backend {
    server order-api-a:5002 max_fails=1 fail_timeout=5s;
    server order-api-b:5002 backup;
}

# Port publik: hanya website pelanggan dan GET katalog aktif.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /js/operasional.js { return 404; }
    location ^~ /css/ { try_files $uri =404; }
    location ^~ /js/ { try_files $uri =404; }
    location ^~ /assets/ { try_files $uri =404; }

    location = /api/services {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($args != "") { return 400; }
        proxy_pass http://catalog-api:5001;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / { return 404; }
}

# Port admin hanya dipublikasikan di 127.0.0.1 oleh Docker Compose.
server {
    listen 81;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = / { return 302 /operasional.html; }
    location / { try_files $uri =404; }

    location ^~ /api/services {
        proxy_pass http://catalog-api:5001;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location ^~ /api/ {
        proxy_pass http://order_backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_send_timeout 12s;
        proxy_read_timeout 12s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;
    }
}
